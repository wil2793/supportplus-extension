<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 320px; padding: 16px; font-family: system-ui; }
    h3 { margin: 0 0 12px; }
    #status { margin: 10px 0; font-size: 13px; color: #555; min-height: 18px; }
    button { width: 100%; padding: 10px; font-size: 14px; cursor: pointer; border: none; border-radius: 6px; color: #fff; background: #4CAF50; margin-bottom: 8px; }
    button:disabled { background: #ccc; cursor: wait; }
    .progress { width: 100%; height: 6px; background: #eee; border-radius: 3px; margin-top: 8px; }
    .progress-bar { height: 100%; background: #4CAF50; border-radius: 3px; transition: width 0.3s; }
    hr { border: none; border-top: 1px solid #eee; margin: 12px 0; }
    label { font-size: 12px; color: #555; display: block; margin-bottom: 4px; }
    input { width: 100%; padding: 6px 8px; font-size: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; margin-bottom: 8px; }
    .saved { color: #4CAF50; font-size: 12px; }
  </style>
</head>
<body>
  <h3>📋 SupportPlus Tools</h3>

  <h3>🟣 Monday.com</h3>
  <label>API Token</label>
  <input type="password" id="mondayToken" placeholder="Pega tu token de Monday aquí">
  <a href="https://macropay7.monday.com/apps/manage/tokens" target="_blank" style="font-size:11px;color:#6C63FF;display:block;margin-bottom:8px;">¿No tienes token? Obtenerlo aquí →</a>
  <button id="saveToken" style="background:#6C63FF;">Guardar Token</button>
  <div id="mondayStatus"></div>

  <script src="popup.js"></script>
</body>
</html>
